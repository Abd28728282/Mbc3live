<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- منع إرسال Referrer لمنع حظر خادم البث -->
    <meta name="referrer" content="no-referrer">
    <title>MBC 3 Live Stream</title>
    
    <!-- مكتبات التشغيل المستخرجة من السكربت الأصلي -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: #000;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <video id="videoPlayer" controls autoplay playsinline muted></video>

    <script>
        // المتغير المشفر المستخرج مباشرة من كود الصفحة الأصلي
        var embed_c = 'YUhSMGNITTZMeTl6YUdRdFoyTndMV3hwZG1VdVpXUm5aVzVsZUhSalpHNHVibVYwTDJ4cGRtVXZZbWwwYlc5MmFXNHRiV0pqTFRNdGRYTmhMelZrTlRneU5qVmhPRFl5WVRRM05tUmpOMlk1TnpZNU5HRmtaR0kxWkdWa0wybHVaR1Y0TG0wemRUZz0=';

        // دالة فك تشفير Base64 المزدوجة المأخوذة من السكربت 533.js
        function decodeStream(encodedData) {
            try {
                // فك التشفير الأول
                var firstDecode = atob(encodedData).replace(/&amp;/g, "&");
                // فك التشفير الثاني
                var finalUrl = atob(firstDecode).replace(/&amp;/g, "");
                return finalUrl;
            } catch (e) {
                console.error("خطأ في فك تشفير الرابط:", e);
                return null;
            }
        }

        $(document).ready(function() {
            // استخراج الرابط المباشر
            var streamUrl = decodeStream(embed_c);
            console.log("Stream URL Unlocked:", streamUrl);

            var video = document.getElementById('videoPlayer');

            if (streamUrl) {
                if (Hls.isSupported()) {
                    var hls = new Hls({
                        enableWorker: true,
                        lowLatencyMode: true
                    });
                    hls.loadSource(streamUrl);
                    hls.attachMedia(video);
                    hls.on(Hls.Events.MANIFEST_PARSED, function() {
                        video.play();
                    });
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = streamUrl;
                    video.addEventListener('loadedmetadata', function() {
                        video.play();
                    });
                } else {
                    // في حال كان الرابط عبارة عن iframe مباشر
                    document.body.innerHTML = '<iframe src="' + streamUrl + '" style="width:100%;height:100%;border:none;" allow="autoplay; fullscreen" allowfullscreen></iframe>';
                }
            }
        });
    </script>
</body>
</html>
