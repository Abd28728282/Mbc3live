<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>البث المباشر</title>
    
    <!-- مكتبة Video.js (CSS & JS) -->
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
        }

        /* تعديل حجم مشغل Video.js لملء الشاشة بالكامل */
        .video-js {
            width: 100vw !important;
            height: 100vh !important;
        }

        /* ضبط الفيديو الداخلي */
        .vjs-tech {
            object-fit: contain;
        }
    </style>
</head>
<body>

    <video
        id="live-player"
        class="video-js vjs-default-skin"
        controls
        autoplay
        preload="auto"
        playsinline>
        <source src="https://pbc.furrera.ps/PalestineEDU/index.m3u8" type="application/x-mpegURL">
    </video>

    <script>
        // تهيئة المشغل
        const player = videojs('live-player', {
            autoplay: 'any', // محاولة التشغيل التلقائي حتى مع قيود المتصفحات
            responsive: true,
            fluid: false
        });
    </script>

</body>
</html>
