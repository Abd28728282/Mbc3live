<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>البث المباشر</title>

    <!-- مكتبة ArtPlayer.js -->
    <script src="https://cdn.jsdelivr.net/npm/artplayer/dist/artplayer.js"></script>
    <!-- مكتبة HLS.js لدعم بث m3u8 -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
        }

        .artplayer-app {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>

    <div class="artplayer-app"></div>

    <script>
        // إضافة متغير عشوائي أو وقت لمنع تخزين الرابط في الذاكرة المؤقتة
        const streamUrl = 'https://pbc.furrera.ps/PalestineEDU/index.m3u8?t=' + new Date().getTime();

        const art = new Artplayer({
            container: '.artplayer-app',
            url: streamUrl,
            isLive: true,
            autoplay: true,
            muted: false, 
            autoSize: true,
            fullscreen: true,
            fullscreenWeb: true,
            type: 'm3u8',
            customType: {
                m3u8: function (video, url) {
                    if (Hls.isSupported()) {
                        // إعدادات خاصة لـ HLS لمنع تراكم الذاكرة المؤقتة للـ Buffer
                        const hls = new Hls({
                            maxBufferLength: 30,          // الحد الأقصى للـ Buffer بالثواني
                            maxMaxBufferLength: 60,
                            liveSyncDurationCount: 3,     // تقليل التأخير والابقاء على البث المباشر الحقيقي
                            liveMaxLatencyDurationCount: 10,
                            enableWorker: true,
                            // إضافة عشوائية لطلب الأجزاء لمنع الكاش المحلي إن وجد
                            loader: Hls.DefaultConfig.loader
                        });
                        hls.loadSource(url);
                        hls.attachMedia(video);
                    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                        video.src = url;
                    }
                },
            },
        });

        // التعامل مع منع المتصفح للتشغيل التلقائي مصحوباً بالصوت
        art.on('ready', () => {
            const playPromise = art.play();
            
            if (playPromise !== undefined) {
                playPromise.catch(() => {
                    art.muted = true;
                    art.play();
                    art.notice.show = 'اضغط على الشاشة لتفعيل الصوت';
                });
            }
        });
    </script>

</body>
</html>
